name: health_assistant_app
description: A privacy‑first Flutter health assistant MVP.
publish_to: "none" # this is a private package.
version: 0.1.0
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  firebase_core: ^2.26.0
  firebase_auth: ^4.17.0
  flutter_svg: ^2.0.9
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
